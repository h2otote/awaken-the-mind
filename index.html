<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>👁️ Awaken The Mind 👁️</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;

                /* Background Image Setup */
                
                background-image: 
                    linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
                    url('blackleaders.jpeg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-color: #000; /* Fallback color while image loads */
            }
            body {
                display: flex;
                flex-direction: column;
            }
            .flexbox {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-grow: 1;
                width: 100%;
            }
            .iframecontainer {
                width: 50%;
                height: auto;
                border: #653AA4 solid 20px;
                border-radius: 32px;
                overflow: hidden;
                aspect-ratio: 16/9;
            }
            .iframecontainer iframe {
                width: 100%;
                height: 100%;
                border: none;
                border-radius: 12px;       /* Inner content curvature */
                display: block;
            }
            .atm-header {
                color: #653AA4;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: 64px;
                font-weight: 700;
                text-align: center;
                padding-top: 20px;
            }
        </style>
    </head>
    <body>
        <h1 class="atm-header">Awaken The Mind TV</h1>

        <div class="flexbox">
            <div class="iframecontainer">  
                <iframe 
                    id="myIframe" 
                    src="https://player.viloud.tv/embed/channel/f28623cde4bdbef1e39b7eefeefe1ca6?autoplay=1&volume=1&controls=1&title=1&share=1&open_playlist=0&random=0" 
                    allow="autoplay; fullscreen" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </body>
</html>
