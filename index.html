<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>👁️ Awaken The Mind 👁️</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;

                /* Background Image Setup */
                background-image: 
                    linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
                    url('blackleaders.jpeg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-color: #000; /* Fallback color */
            }

            body {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            .atm-header {
                color: #653AA4;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: clamp(2rem, 5vw, 4rem); /* Responsive font sizing */
                font-weight: 700;
                text-align: center;
                padding-top: 20px;
                text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            }

            .flexbox {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-grow: 1;
                width: 100%;
                padding: 20px;
            }

            .iframecontainer {
                width: 90%;
                max-width: 960px; /* Prevents frame from growing too large on wide monitors */
                border: #653AA4 solid 10px; /* Reduced thickness for better mobile fit */
                border-radius: 24px;
                overflow: hidden;
                aspect-ratio: 16 / 9;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            }

            .iframecontainer iframe {
                width: 100%;
                height: 100%;
                border: none;
                border-radius: 12px;
                display: block;
            }

            /* Responsive Adjustments for Mobile */
            @media (min-width: 768px) {
                .iframecontainer {
                    border-width: 20px;
                    border-radius: 32px;
                }
            }
        </style>
    </head>
    <body>
        <h1 class="atm-header">Awaken The Mind TV</h1>

        <div class="flexbox">
            <div class="iframecontainer">  
                <iframe 
                    id="myIframe" 
                    src="https://player.viloud.tv/embed/channel/f28623cde4bdbef1e39b7eefeefe1ca6?autoplay=1&volume=1&controls=1&title=1&share=1&open_playlist=0&random=0" 
                    allow="autoplay; fullscreen" 
                    allowfullscreen
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </body>
</html>
